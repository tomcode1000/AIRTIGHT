<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 35" width="44" height="35" role="img" aria-label="AIRTIGHT">
  <title>AIRTIGHT</title>
  <!--
    The mark is the mechanism, not decoration.

    A track runs left to right. It is solid up to a point, then it is cut: the
    crash, and it continues on the far side. The dot sits BEFORE the cut,
    because that is the whole product: the record exists before the risk.

    The bracket is a seal, drawn open on the trailing edge: sealed against loss,
    still able to continue.
  -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC733"/>
      <stop offset="1" stop-color="#F59E00"/>
    </linearGradient>
  </defs>
  <g>
  <path d="M38 2 H8 A6 6 0 0 0 2 8 V27 A6 6 0 0 0 8 33 H38" fill="none" stroke="url(#a)" stroke-width="4" stroke-linecap="butt"/>
  <path d="M7 17.5 H19" fill="none" stroke="url(#a)" stroke-width="4" stroke-linecap="butt"/>
  <circle cx="19" cy="17.5" r="3.4" fill="url(#a)"/>
  <path d="M26.2 10.5 V24.5" fill="none" stroke="url(#a)" stroke-width="3" stroke-linecap="butt"/>
  <path d="M30 17.5 H44" fill="none" stroke="url(#a)" stroke-width="4" stroke-linecap="butt"/>
  </g>
</svg>
