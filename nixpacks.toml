# Railway builds with Nixpacks. This needs both runtimes: Node runs the agents
# and the servers, Python provides the memory backend they write to, so a
# Node-only build would deploy a site whose buttons cannot record anything.
[phases.setup]
nixPkgs = ["nodejs_22", "python312", "gcc"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir -r requirements.txt",
]

[start]
cmd = "node airtight/scripts/start-railway.mjs"

[variables]
NODE_ENV = "production"
# The memory backend is reached by absolute path rather than by name.
#
# Setting PATH here would REPLACE the one Nixpacks builds, and Node lives in a
# Nix store path rather than /usr/bin, so overriding it removed `node` from the
# environment and the container died before any of this code ran. Naming the
# binary outright needs no PATH at all.
SIBYL_MCP_BIN = "/opt/venv/bin/sibyl-memory-mcp"
